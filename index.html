    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body { 
        font-family: 'Inter', sans-serif; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Smooth scrolling */
      .scroll-smooth { scroll-behavior: smooth; }
      /* Float animation for particles */
      @keyframes float {
        from { transform: translateY(0) rotate(0deg); opacity: 0.3; }
        to { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
      }
      /* Better scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(107, 33, 168, 0.15); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(107, 33, 168, 0.3); }
    </style>
